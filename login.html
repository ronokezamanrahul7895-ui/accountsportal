<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Login - Accounts Portal</title><link rel="stylesheet" href="css/style.css" /></head>
<body><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;">
<div class="card" style="width:100%;max-width:380px;padding:28px;"><strong style="font-size:18px;">Accounts Portal Login</strong>
<form id="loginForm" style="margin-top:16px;">
<div class="form-group"><label>Email</label><input type="email" id="email" required autocomplete="username" /></div>
<div class="form-group"><label>Password</label><input type="password" id="password" required autocomplete="current-password" /></div>
<button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
<div id="loginError" style="color:#a3271f;font-size:13px;margin-top:8px;display:none;"></div></form></div></div>
<script type="module" src="js/login.js"></script></body></html>
